name: Enforce main source branch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  check-source-branch:
    name: Require develop as source
    runs-on: ubuntu-latest

    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "❌ Pull requests into main must come from develop."
            echo "Source branch: ${{ github.head_ref }}"
            exit 1
          fi

          echo "✅ Source branch is develop."